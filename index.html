<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat IA</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- ESTILIZAÇÃO DO CHAT --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 { color: #1a73e8; margin-top: 20px; }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 70vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-top: 10px;
        }

        .chat-header {
            background: #1a73e8;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Balões de Mensagem */
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-msg {
            align-self: flex-end;
            background-color: #1a73e8;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            align-self: flex-start;
            background-color: #e8eaed;
            color: #3c4043;
            border-bottom-left-radius: 2px;
        }

        /* Área de Input */
        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        #promptInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            padding-left: 15px;
        }

        #sendButton {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        #sendButton:disabled { background: #ccc; }

        .loading { font-style: italic; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>Minha Primeira IA</h1>
    
    <div class="chat-container">
        <div class="chat-header">Chat Geral Agente</div>
        
        <div class="chat-messages" id="chatBox">
            <div class="message bot-msg">Olá! Sou sua IA. Como posso te ajudar hoje?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="promptInput" placeholder="Digite sua pergunta..." autocomplete="off">
            <button id="sendButton" onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const promptInput = document.getElementById("promptInput");
        const button = document.getElementById("sendButton");

        promptInput.addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                enviarMensagem();
            }
        });

        async function enviarMensagem() {
            const textUser = promptInput.value.trim();
            if (!textUser) return;

            // 1. Adiciona pergunta do usuário
            adicionarMensagemNaTela(textUser, "user-msg");
            promptInput.value = "";
            button.disabled = true;

            // 2. Adiciona feedback de "pensando"
            const loadingMsgId = "loading-" + Date.now();
            adicionarMensagemNaTela("A IA está pensando...", "bot-msg", loadingMsgId);

            // 3. Chama a API
            await perguntaIA(textUser, loadingMsgId);
        }

        async function perguntaIA(texto, loadingId) {
            try {
                const resposta = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: texto })
                });

                const dados = await resposta.json();
                
                // Remove o "pensando..."
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (dados.resposta) {
                    adicionarMensagemNaTela(converterMarkdownParaHtml(dados.resposta), "bot-msg");
                } else if (dados.erro) {
                    adicionarMensagemNaTela("Erro: " + dados.erro, "bot-msg");
                }
            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                adicionarMensagemNaTela("Falha ao conectar com o servidor.", "bot-msg");
            } finally {
                button.disabled = false;
                promptInput.focus();
            }
        }

        function adicionarMensagemNaTela(texto, classeCss, id = null) {
            const div = document.createElement("div");
            div.className = `message ${classeCss}`;
            if (id) div.id = id;
            div.innerHTML = texto;
            
            chatBox.appendChild(div);
            
            // Rola o chat para o fim automaticamente
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function converterMarkdownParaHtml(texto) {
            // Verificamos se a biblioteca marked existe
        
            if (typeof marked !== 'undefined') {
            // marked.parse converte ** em <strong>, * em <li>, etc.
            return marked.parse(texto);
        }
       // Caso a biblioteca falhe, retorna o texto puro com quebras de linha básicas
       return texto.replace(/\n/g, '<br>');}
    </script>
</body>
</html>
